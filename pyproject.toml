[project]
name = "maaverge-runtime"
version = "0.1.1"
description = "Local execution, planning and immutable runtime updates for Maa Verge"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "filelock>=3.18,<4",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/runtime/maaverge_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["services/runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["services/runtime/maaverge_runtime/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["services/runtime/maaverge_runtime"]
exclude = ["vendor"]
ignore_missing_imports = true
check_untyped_defs = true
