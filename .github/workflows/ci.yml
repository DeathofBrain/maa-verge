name: Checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: application
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci-image
      - uses: actions/cache@v4
        with:
          path: .cache/ci
          key: linux-application-${{ hashFiles('tools/ci/Dockerfile', 'tools/ci/install.sh', 'pnpm-lock.yaml', 'uv.lock', 'apps/desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-application-
      - name: Check application and browser fixtures in the Linux image
        run: |
          docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --env CI=true maa-verge-ci:local bash tools/ci/run.sh app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-fixture-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  native:
    name: native (${{ matrix.os }}, ${{ matrix.architecture }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
          - os: ubuntu-22.04
            architecture: x64
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci-image
        if: runner.os == 'Linux'
      - uses: ./.github/actions/host-setup
        if: runner.os != 'Linux'
      - uses: astral-sh/setup-uv@v6
        if: runner.os != 'Linux'
        with:
          # Keep this aligned with tools/ci/Dockerfile.
          version: '0.13.5'
          enable-cache: true
      - name: Install the Python 3.12 test environment
        if: runner.os != 'Linux'
        run: uv sync --frozen
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: |
            .cache/ci
            apps/desktop/src-tauri/target
          key: linux-native-${{ hashFiles('tools/ci/Dockerfile', 'tools/ci/install.sh', 'pnpm-lock.yaml', 'uv.lock', 'apps/desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-native-
      - name: Ensure the NSIS compiler is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $nsis)) { throw "NSIS compiler was not installed at $nsis" }
          "MAAVERGE_NSIS_COMPILER=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check native toolchain and host packaging fixtures
        if: runner.os != 'Linux'
        env:
          MAAVERGE_INSTALLER_TOOLS_REQUIRED: '1'
        run: node tools/check.mjs --native
      - name: Check native toolchain in the Linux CI image
        if: runner.os == 'Linux'
        run: |
          docker run --rm --init --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --env CI=true maa-verge-ci:local bash tools/ci/run.sh native
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-test-diagnostics-${{ matrix.os }}-${{ matrix.architecture }}
          path: |
            build/native/Testing/Temporary/
            build/macos-install-smoke/
          if-no-files-found: ignore
