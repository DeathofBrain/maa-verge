name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; leave empty to select the latest release
        default: ''
        required: false
        type: string
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'DeathofBrain' }}
    runs-on: macos-latest
    steps:
      - uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: maa-verge
          version_name: ${{ inputs.tag || github.event.release.tag_name }}

          owner: DeathofBrain
          repo: maa-verge
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
