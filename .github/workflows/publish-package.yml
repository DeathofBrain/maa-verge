name: Publish installer package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag (for example v0.1.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'DeathofBrain/maa-verge'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test release validation
        run: node --test tools/tests/github-package.test.mjs
      - name: Download and verify the published installers
        id: package
        run: node tools/github-package.mjs prepare
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse an existing package version
        run: node tools/github-package.mjs check-tag
      - name: Publish installer files (no desktop runtime)
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: dist/github-package
          file: .github/package/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.package.outputs.image }}:${{ steps.package.outputs.version }}
          build-args: |
            SOURCE=${{ steps.package.outputs.source }}
            VERSION=${{ steps.package.outputs.version }}
            REVISION=${{ steps.package.outputs.revision }}
          provenance: false
      - name: Extract and verify the published package by immutable digest
        env:
          IMAGE: ${{ steps.package.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          VERIFY_DIRECTORY="$(mktemp -d "$RUNNER_TEMP/maa-verge-package.XXXXXX")"
          CONTAINER="$(docker create --platform linux/amd64 "$IMAGE@$DIGEST" /unused)"
          trap 'docker rm "$CONTAINER" >/dev/null' EXIT
          docker cp "$CONTAINER:/packages/." "$VERIFY_DIRECTORY/"
          node tools/github-package.mjs verify-image "$VERIFY_DIRECTORY"
          (
            cd "$VERIFY_DIRECTORY"
            sha256sum --check --strict SHA256SUMS.txt
          )
      - name: Record the published digest
        env:
          IMAGE: ${{ steps.package.outputs.image }}
          VERSION: ${{ steps.package.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Published `%s:%s` (`%s`). The image contains installers in `/packages`; install the matching desktop package.\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
