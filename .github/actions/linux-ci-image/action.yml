name: Prepare Linux CI image
description: Build the Ubuntu 22.04 toolchain image from this checkout with shared layer caching
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: tools/ci/Dockerfile
        platforms: linux/amd64
        load: true
        tags: maa-verge-ci:local
        cache-from: type=gha,scope=linux-ci-image
        cache-to: type=gha,mode=max,scope=linux-ci-image
