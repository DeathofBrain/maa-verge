name: Prepare native host
description: Install Node, pnpm, Rust, workspace dependencies and the pinned Bun runtime
inputs:
  rust:
    description: Prepare Rust only when native Rust checks or release builds need it
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - uses: dtolnay/rust-toolchain@1.90.0
      if: inputs.rust == 'true'
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      if: inputs.rust == 'true'
      with:
        workspaces: apps/desktop/src-tauri
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: node tools/setup-bun.mjs
      shell: bash
